[project]
name = "ai-presentation"
version = "0.1.0"
description = "Agentic AI presentation generator"
readme = "README.md"
authors = [
    { name = "Maryam Sayed", email = "maryamsayed207@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=1.13.0",
    "basicsr>=1.4.2",
    "diffusers>=0.41.0",
    "edge-tts>=7.2.8",
    "gfpgan>=1.3.8",
    "langgraph>=1.2.14",
    "numpy<2",
    "pillow>=12.3.0",
    "python-pptx>=1.0.2",
    "realesrgan>=0.3.0",
    "rembg",
    "onnxruntime",
    "simple-lama-inpainting>=0.1.0",
    "streamlit>=1.65.0",
    "streamlit-image-coordinates>=0.4.1",
    "torch>=2.7",
    "torchvision",
    "transformers>=5.19.0",
    "ultralytics>=8.4.175",
    "openai>=3.29.0",
    "tavily-python>=0.8.5",
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
